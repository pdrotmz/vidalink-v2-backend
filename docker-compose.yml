services:

  postgres:
    image: postgres:17
    container_name: vidalink-postgres
    environment:
      POSTGRES_DB: vidalink
      POSTGRES_USER: vidalink
      POSTGRES_PASSWORD: vidalink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: vidalink-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: