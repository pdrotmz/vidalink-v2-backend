spring:
  application:
    name: vidalink

  datasource:
    url: jdbc:h2:mem:vidalink
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

server:
  port: 8080

minio:
 url: http://localhost:9000
 access-key: minioadmin
 secret-key: minioadmin

jwt:
  secret: 9d2a1d7e4c5f6b8a9f0d1c2b3a4e5f679d2a1d7e4c5f6b8a9f0d1c2b3a4e5f67
